- name: create ec2 instances and r53
  hosts: local
  connection: local
  vars:
    instances:
    - backend
    - frontend
    - mysql
    zone: yefy.shop
  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        vpc_subnet_id: subnet-0cdb6ba0a3d291657
        security_group: sg-0e2073a716fbb9bf0
        instance_type: t3.micro
        image_id: ami-0055977a6e828a4f4
        region: us-east-1
      loop: "{{ instances }}"
      register: ec2_output

    - name: print ec2 describe
      ansible.builtin.debug:
        msg: "{{ ec2_output }}"

    - name: Create a record
      amazon.aws.route53:
        state: present
        zone: "{{ zone }}"
        record: "{{ item.item }}.{{ zone }}"
        type: A
        value: "{{ item.instances[0].private_ip_address }}"
        ttl: 1
        wait: true
        overwrite: true
      loop: "{{ ec2_output.results }}"

    - name: Create a record
      amazon.aws.route53:
        state: present
        zone: "{{ zone }}"
        record: "{{ zone }}"
        type: A
        value: "{{ item.instances[0].public_ip_address }}"
        ttl: 1
        wait: true
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: item.item == "frontend"
- name: create ec2 instances and r53
  hosts: local
  connection: local
  become: yes
  vars:
    instances:
      - mysql
      - backend
      - frontend
  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        vpc_subnet_id: subnet-0cdb6ba0a3d291657
        security_group: sg-0e2073a716fbb9bf0
        instance_type: t3.micro
        image_id: ami-0055977a6e828a4f4
        region: us-east-1
      loop: "{{ instances }}"
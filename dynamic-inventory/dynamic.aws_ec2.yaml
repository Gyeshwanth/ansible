plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  tag:Name:
    - 'frontend'
  instance-state-name : running
keyed_groups:
  - key: tags.Name
    prefix: "dynamic"
    separator: "-"
hostnames:
  # You can also specify a list in order of precedence for hostname variables.
  - private-ip-address
compose:
  ansible_host: private_ip_address

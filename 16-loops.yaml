- name: loops
  hosts: frontend
  vars:
    users:
      - yeshwanth
      - uma
  tasks:
    - name: print names with vars use loops
      ansible.builtin.debug:
        msg: "hello, {{ item }}"   # item reserved in ansible for loops
      loop: "{{ users }}"


    - name: print name with loops
      ansible.builtin.debug:
        msg: "hello, {{ item }}"
      loop:
        - ravi
        - appa

    - name: print name with loops
      ansible.builtin.dnf:
        name: {{ item.name }}
        state: {{ item.state }}
      loop:
        - { name: 'unzip',state: 'present' }
        - { name: 'mysql',state: 'absent'}

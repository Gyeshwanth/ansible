- name: control with gather facts
  hosts: frontend
  tasks:
    - name: condition based facts variables
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: os_family == "RedHat"

    - name: install nginx if Debian
      ansible.builtin.apt:
        name: nginx
        state: present
        when: ansible_os_family == "Debian"